services:
  backend:
    build: ./api
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/ma_collection.db
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - db_data:/app/data

  frontend:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
